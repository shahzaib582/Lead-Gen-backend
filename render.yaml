# Free/hobby: workers run inside the web process (RUN_WORKERS_IN_WEB=1).
# Dedicated worker services need a paid Render plan — do not declare them as plan: free.

services:
  - type: web
    name: leadgen-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production

      - key: LOG_LEVEL
        value: info

      - key: TRUST_PROXY
        value: '1'

      - key: RUN_WORKERS_IN_WEB
        value: '1'

      - key: REDIS_HOST
        fromService:
          type: redis
          name: leadgen-redis
          property: host

      - key: REDIS_PORT
        fromService:
          type: redis
          name: leadgen-redis
          property: port

      - key: PUBLIC_BASE_URL
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: CORS_ORIGIN
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: BREVO_API_KEY
        sync: false

      - key: BREVO_SENDER_EMAIL
        sync: false

      - key: BREVO_SENDER_NAME
        sync: false

      - key: OPENAI_API_KEY
        sync: false

  - type: redis
    name: leadgen-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all
